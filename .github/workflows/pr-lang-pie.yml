name: PR Lang Pie (Linguist, All Time)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * 0" # 毎週 月曜 04:20 JST 相当 (UTC 日曜 19:20)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests matplotlib
          gem install github-linguist

      - name: Generate PR language pie (All time, Linguist-based)
        env:
          GH_TOKEN_MAIN: ${{ secrets.GH_TOKEN_MAIN }}
          GH_TOKEN_WORK: ${{ secrets.GH_TOKEN_WORK }}
        run: |
          python scripts/pr_lang_pie_linguist_alltime.py \
            --users Javakky,Javakky-pxv \
            --metric churn \
            --out-svg generated/pr_langs.svg \
            --out-json generated/pr_langs.json \
            --max-prs-per-window 900 \
            --window month

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/pr_langs.svg generated/pr_langs.json
          git commit -m "chore: update pr language pie (linguist, all time)" || exit 0
          git push
